name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate playbook graphs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agentflow and test deps
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"
      - name: Unit tests
        run: python3 -m pytest -q
      - name: agentflow validate security-review
        run: agentflow validate pipelines/security-review.py
