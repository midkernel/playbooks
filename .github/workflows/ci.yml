name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only older runs of the same PR are superseded. Main pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate playbook graphs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Pip cache exact-key hit: ${{ steps.python.outputs.cache-hit || 'false' }}"
        run: echo 'Cached downloads are optional; installation and all checks still run.'
      - name: Install agentflow and test deps
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"
      - name: Unit tests
        run: python3 -m pytest -q
      - name: agentflow validate graphs
        run: |
          agentflow validate pipelines/security-review.py
          agentflow validate pipelines/solana-validator-security.py
          agentflow validate pipelines/firedancer-fuzz-triage.py
          agentflow validate pipelines/goal-security-review.py
